name: Deploy al VPS

on:
  push:
    branches:
      - main

# Dos pushes seguidos no deben ejecutar `git reset --hard` en paralelo
# sobre el mismo directorio del VPS.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # No hay checkout: el deploy es un `git fetch` ejecutado dentro del VPS,
      # así que traer el código al runner no aportaba nada.

      - name: Configurar SSH Agent y Clave
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Registrar Host de Confianza
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 -H srv777726.hstgr.cloud >> ~/.ssh/known_hosts

      - name: Deploy al VPS
        run: |
          ssh -p 2222 root@srv777726.hstgr.cloud << 'ENDSSH'
            set -e
            echo "📦 Iniciando deploy dmbestudio..."

            if [ -d "/var/www/dmbestudio/.git" ]; then
              echo "🔄 Repo encontrado, actualizando..."
              cd /var/www/dmbestudio
              git fetch origin main
              # -B fuerza que el working tree quede EN main, no en la rama que
              # hubiera quedado apuntada de antes (auditoría A-01).
              git checkout -B main origin/main
              git reset --hard origin/main
            else
              echo "📥 Clonando repo..."
              rm -rf /var/www/dmbestudio
              git clone --branch main https://github.com/bleonardo12/dmbestudio.git /var/www/dmbestudio
              cd /var/www/dmbestudio
            fi

            echo "✅ Rama y último commit:"
            git rev-parse --abbrev-ref HEAD
            git log -1 --oneline
            echo "🎉 Deploy completado!"
          ENDSSH

      - name: Notificar resultado
        if: success()
        run: echo "✅ Deploy exitoso a srv777726.hstgr.cloud"
