# ============================================================================
#  dmbestudio.com — Cabeceras de seguridad (AUDITORIA.md S2)
# ============================================================================
#  CÓMO APLICARLO EN EL VPS (una sola vez; el deploy automático NO toca nginx):
#
#    scp -P 2222 nginx/security-headers.conf \
#        root@srv777726.hstgr.cloud:/etc/nginx/snippets/dmbestudio-security.conf
#
#  y dentro del bloque `server { ... }` del sitio (normalmente en
#  /etc/nginx/sites-available/dmbestudio) agregar:
#
#    include /etc/nginx/snippets/dmbestudio-security.conf;
#
#  Finalmente:  nginx -t && systemctl reload nginx
#
#  NOTA: `add_header` no se hereda si un `location` interno define sus propios
#  add_header. Si algún location agrega cabeceras, repetir el include ahí.
# ============================================================================

# HSTS — sólo tiene efecto sobre HTTPS. Agregar `preload` recién cuando se
# quiera enviar el dominio a hstspreload.org (es difícil de revertir).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Evita que el navegador adivine el MIME type
add_header X-Content-Type-Options "nosniff" always;

# No filtrar la URL completa hacia terceros
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Desactiva APIs del navegador que el sitio no usa
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Anti-clickjacking para navegadores viejos (los modernos usan frame-ancestors).
# SAMEORIGIN y no DENY para no romper el modo Preview de GTM / Tag Assistant,
# que carga el sitio dentro de un iframe.
add_header X-Frame-Options "SAMEORIGIN" always;

# --- Content Security Policy -------------------------------------------------
#  Orígenes reales del sitio tras el rediseño:
#   - script:  propio + Google Tag Manager / GA4 (inyectados por GTM)
#   - style:   propio + inline (critical CSS y atributos style del markup)
#   - font:    propio (Space Grotesk self-hosted; ya no se usa Google Fonts)
#   - connect: GA4 / Google Ads (measurement + conversion linker)
#   - frame:   GTM (noscript) y Calendly (cuando se active la agenda)
#
#  'unsafe-inline' en script-src sigue siendo necesario por el snippet de GTM,
#  el bloque de Consent Mode y los JSON-LD. Para eliminarlo habría que servir
#  el HTML con nonces desde nginx (sub_filter), lo cual rompe el cacheo estático.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://tagassistant.google.com; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.analytics.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com https://analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://region1.google-analytics.com; frame-src https://www.googletagmanager.com https://td.doubleclick.net https://calendly.com https://*.calendly.com; manifest-src 'self'; upgrade-insecure-requests" always;
