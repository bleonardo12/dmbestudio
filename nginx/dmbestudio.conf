# ============================================================================
#  dmbestudio.com — server block de referencia para el VPS
#  Sitio 100% estático servido desde /var/www/dmbestudio (repo git, deploy
#  automático por GitHub Actions).
#
#  Este archivo es una REFERENCIA. Si el servidor ya tiene un bloque funcionando
#  con los certificados de Let's Encrypt, lo mínimo y más seguro es sólo agregar
#  el include de nginx/security-headers.conf a ese bloque existente.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dmbestudio.com www.dmbestudio.com;
    return 301 https://www.dmbestudio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dmbestudio.com;

    ssl_certificate     /etc/letsencrypt/live/dmbestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmbestudio.com/privkey.pem;

    # Canónico: todo a www (coincide con <link rel="canonical"> del HTML)
    return 301 https://www.dmbestudio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dmbestudio.com;

    root /var/www/dmbestudio;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/dmbestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmbestudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/dmbestudio-security.conf;

    # --- Compresión ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json image/svg+xml;
    # woff2 ya viene comprimido: no re-comprimir.

    # --- Ruteo --------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # No exponer archivos de trabajo del repo
    location ~ ^/(\.git|\.github|nginx|README\.md|MEDICION\.md|INSTRUCCIONES_RAPIDAS\.md|Mejoras) {
        deny all;
        return 404;
    }

    # --- Cache --------------------------------------------------------------
    # Assets con nombre estable: cache corto para poder actualizar sin purgar.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        include /etc/nginx/snippets/dmbestudio-security.conf;
    }

    location ~* \.(woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/dmbestudio-security.conf;
    }

    location ~* \.(webp|jpg|jpeg|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/dmbestudio-security.conf;
    }

    # La escala del monotributo cambia por semestre: no cachear agresivamente.
    location = /data/monotributo-escala.json {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        include /etc/nginx/snippets/dmbestudio-security.conf;
        types { } default_type application/json;
    }

    location = /manifest.json {
        types { } default_type application/manifest+json;
        include /etc/nginx/snippets/dmbestudio-security.conf;
    }

    # HTML siempre fresco (el deploy es un git reset --hard)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/dmbestudio-security.conf;
    }

    error_page 404 /index.html;
}
