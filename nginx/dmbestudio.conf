# ============================================================================
#  dmbestudio.com — servidor de producción
#  Sitio estático en /var/www/dmbestudio (repo git, deploy por GitHub Actions).
#  Canónico: https://www.dmbestudio.com
# ============================================================================

# --- Canonicalización: el resto de los hostnames redirige a www.dmbestudio.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dmbestudio.com dmbestudio.com.ar www.dmbestudio.com.ar;

    ssl_certificate /etc/letsencrypt/live/dmbestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmbestudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # El desafío ACME debe resolverse en el host que se está validando:
    # se sirve desde el mismo webroot y NO se redirige.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dmbestudio;
    }

    location / {
        return 301 https://www.dmbestudio.com$request_uri;
    }
}

# --- Sitio
server {
    server_name www.dmbestudio.com;

    root /var/www/dmbestudio;
    index index.html;

    access_log /var/log/nginx/dmbestudio-access.log;
    error_log /var/log/nginx/dmbestudio-error.log;

    # Cabeceras de seguridad (repo: nginx/security-headers.conf)
    include /etc/nginx/snippets/dmbestudio-security.conf;

    # --- Repositorio y archivos de trabajo: no se exponen (auditoría X-01 / X-02)
    # Se excluye /.well-known para no romper la renovación de Let's Encrypt.
    location ~ ^/\.(?!well-known/) {
        access_log off;
        return 404;
    }
    location ~ ^/(nginx|\.github)/ {
        access_log off;
        return 404;
    }
    location ~* \.(md|yml|yaml|conf|bak|sample)$ {
        access_log off;
        return 404;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        # HTML y JSON siempre frescos: el deploy es un git reset --hard
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Fuentes e imágenes: contenido inmutable, nombre estable
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        log_not_found off;
    }

    # CSS y JS: se versionan por query string en el HTML (?v=AAAAMMDD),
    # así que no conviene cache infinita — un bump de versión debe verse ya.
    location ~* \.(js|css)$ {
        expires 1h;
        log_not_found off;
    }

    server_tokens off;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dmbestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dmbestudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dmbestudio.com dmbestudio.com.ar www.dmbestudio.com www.dmbestudio.com.ar;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dmbestudio;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
